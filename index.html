<!DOCTYPE html>
<!-- HTML5 dokument -->

<html lang="et">
<!-- Lehe keel on eesti -->

<head>
  <!-- Lehe info -->

  <meta charset="UTF-8">
  <!-- Eesti tähed töötavad -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Sobib telefonile -->

  <title>Todo App</title>
  <!-- Brauseri vahekaardi nimi -->

  <link rel="stylesheet" href="style.css">
  <!-- Ühendab CSS-i -->

</head>

<body>
  <!-- Lehel nähtav osa -->

  <div class="container">
    <!-- Peamine konteiner -->

    <h1>Todo List</h1>
    <!-- Pealkiri -->

    <input type="text" id="todoInput" placeholder="Lisa tegevus">
    <!-- Koht ülesande kirjutamiseks -->

    <button id="addBtn">Lisa</button>
    <!-- Lisa nupp -->

    <div id="todoList"></div>
    <!-- Siia tulevad ülesanded -->

  </div>

  <script src="script.js"></script>
  <!-- Ühendab JavaScripti -->

</body>

</html>
<!-- HTML lõpp -->
